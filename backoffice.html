<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Leads — Back Office</title>
<style>
:root{--p:#1d4ed8;--pd:#1e3a8a;--bg:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
a{color:var(--p)}
/* layout */
#side{position:fixed;top:0;left:0;bottom:0;width:240px;background:linear-gradient(180deg,var(--pd),#172554);color:#fff;display:flex;flex-direction:column;z-index:10;transition:transform .2s}
.brand{padding:20px 18px 14px;font-weight:800;font-size:18px}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.7}
#menu{flex:1;overflow-y:auto;padding:4px 10px}
#menu .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin:16px 8px 6px}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbeafe;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500}
#menu button:hover{background:rgba(255,255,255,.08)}
#menu button.on{background:#fff;color:var(--pd);font-weight:700}
.me{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.me button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12px}
main{margin-left:240px;min-height:100vh}
.top{background:#fff;border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;flex:1;min-width:160px}
#burger{display:none;background:none;border:0;font-size:22px;cursor:pointer}
#period{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pg{padding:20px 22px 40px}
/* ui */
input,select,textarea{padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--tx)}
input:disabled{background:#f1f5f9}
textarea{width:100%;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:#eef2ff;color:var(--p)}
.btn.red{background:#dc2626}
.btn.gray{background:#e2e8f0;color:#334155}
.panel{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi span{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:26px;margin-top:4px}
.tCold{color:#0369a1}.tWarm{color:#b45309}.tHot{color:#b91c1c}.tProgres{color:#6d28d9}.tQuotation{color:#1d4ed8}.tDeal{color:#15803d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{background:#f1f5f9;border-radius:6px;height:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:6px}
.bar b{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input{flex:1;min-width:220px}
.cnt{font-size:12px;color:var(--mut);margin-bottom:6px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:12px;color:#475569;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
tr.tot td{font-weight:800;background:#f8fafc}
td.n,th.n{text-align:right}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;background:#f1f5f9;color:#475569}
.Cold{background:#e0f2fe!important;color:#0369a1!important;border-color:#7dd3fc!important}
.Warm{background:#fef3c7!important;color:#b45309!important;border-color:#fcd34d!important}
.Hot{background:#fee2e2!important;color:#b91c1c!important;border-color:#fca5a5!important}
.Progres{background:#ede9fe!important;color:#6d28d9!important;border-color:#c4b5fd!important}
.Quotation{background:#dbeafe!important;color:#1d4ed8!important;border-color:#93c5fd!important}
.Deal{background:#dcfce7!important;color:#15803d!important;border-color:#86efac!important}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-weight:700;cursor:pointer;color:#334155}
.empty{text-align:center;padding:26px;color:var(--mut)}
.mut{color:var(--mut)}.sm{font-size:12px}.mt{margin-top:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
.frm input,.frm select{width:100%}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:30;overflow-y:auto;padding:30px 14px}
.mbox{background:#fff;border-radius:14px;max-width:880px;margin:0 auto}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.mh h2{font-size:18px}
.mh .x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mut)}
.mbd{padding:16px 20px 22px}
.mbd h3{font-size:14px;margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--bd)}
.info{display:grid;grid-template-columns:130px 1fr 130px 1fr;gap:6px 12px;margin-top:12px;font-size:13px;word-break:break-word}
.info .k{color:var(--mut)}
.fu{border-left:3px solid var(--p);padding:8px 11px;margin-top:8px;background:#f8fafc;border-radius:0 8px 8px 0}
.fu.sys{border-left-color:#94a3b8;background:#f1f5f9}
.dlbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-bottom:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.kc{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:13px}
.krow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;margin-top:8px;align-items:center}
.krow input{width:100%}
@media(max-width:760px){.krow{grid-template-columns:1fr 1fr}}
/* login */
#login{max-width:380px;margin:0 auto;padding:80px 16px}
.logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;margin:0 auto 12px}
#login input{width:100%}
#busy{position:fixed;inset:0;background:rgba(15,23,42,.3);display:none;align-items:center;justify-content:center;z-index:50}
.spin{width:42px;height:42px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;right:20px;bottom:20px;background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;z-index:60;display:none;max-width:360px}
#toast.err{background:#dc2626}
@media(max-width:760px){
  #side{transform:translateX(-100%)}
  body.sideopen #side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  main{margin-left:0}
  #burger{display:block}
  .grid2{grid-template-columns:1fr}
  .info{grid-template-columns:110px 1fr}
  #pg{padding:14px}
}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="logo">ML</div>
  <h2 style="text-align:center">Back Office</h2>
  <p class="mut" style="text-align:center;margin-bottom:18px">Marketing Leads — khusus Admin</p>
  <div class="panel">
    <label>Nama</label><input id="lgNama">
    <label>PIN</label><input id="lgPin" type="password" inputmode="numeric" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="width:100%;margin-top:16px;padding:11px" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="brand">Marketing Leads<small>Back Office</small></div>
    <nav id="menu"></nav>
    <div class="me"><span id="meName"></span><button onclick="if(confirm('Keluar?'))doLogout()">Keluar</button></div>
  </aside>
  <main>
    <div class="top">
      <button id="burger" onclick="document.body.classList.toggle('sideopen')">☰</button>
      <h1 id="pgTitle"></h1>
      <div id="period">
        <select id="pPreset" onchange="setPreset(this.value)">
          <option value="semua">Semua periode</option><option value="hari">Hari ini</option><option value="bulan">Bulan ini</option>
          <option value="lalu">Bulan lalu</option><option value="30">30 hari terakhir</option><option value="tahun">Tahun ini</option><option value="custom">Custom</option>
        </select>
        <input type="date" id="pFrom" onchange="setCustom()"><span class="mut">s/d</span><input type="date" id="pTo" onchange="setCustom()">
      </div>
      <button class="btn ghost" onclick="reload()">Muat ulang</button>
    </div>
    <div id="pg"></div>
  </main>
</div>

<div class="modal" id="mdl" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>
<div id="busy"><div class="spin"></div></div>
<div id="toast"></div>

<script>
/* ====== GANTI DENGAN URL WEB APP (Deploy > Web app), akhiran /exec ====== */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzMo6nYmy0sSjeZEWF3g_blAQb6_oFJo02HABjZ3AvsqOLWlNewP58xGpeQmUqQ5oCA/exec';
/* ======================================================================== */
const IS_GAS=!!(window.google&&google.script&&google.script.run);
if(!IS_GAS){
  window.google={script:{run:(function mk(s,f){return new Proxy({},{get(_,k){
    if(k==='withSuccessHandler')return h=>mk(h,f);
    if(k==='withFailureHandler')return h=>mk(s,h);
    return (...a)=>{
      fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:k,args:a})})
        .then(r=>r.json()).then(j=>{if(j.ok)s&&s(j.r);else f&&f(new Error(j.err));})
        .catch(()=>f&&f(new Error('Gagal terhubung ke server. Cek internet / SCRIPT_URL.')));
    };}});})(null,null)}};
}
</script>
<script>
const ST_LEAD=['Cold','Warm','Hot'],ST_SALES=['Progres','Quotation','Deal'],SYS=['Penyerahan','Update Status'],ROLES=['Admin','Marketing','Sales'];
const MENU=[['Utama'],['dash','Dashboard'],['leads','Data Leads'],['fu','Follow Up'],
  ['Laporan'],['rmkt','Laporan Marketing'],['rsales','Laporan Sales'],['rsumber','Laporan Sumber Data'],
  ['Pengaturan'],['users','Pengguna'],['msumber','Master Sumber Data'],['mmetode','Master Metode Follow Up']];
const PERIOD_MENUS=['dash','leads','fu','rmkt','rsales','rsumber'];
let B={pf:'all',token:null,d:null,menu:'dash',from:'',to:'',f:{},editUser:null,mlist:[],mj:''};
const SEG={};
const $=s=>document.querySelector(s);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',err?4500:2200);}
function busy(on){$('#busy').style.display=on?'flex':'none';}
function api(fn,...a){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>{
      const m=String(e&&e.message||e).replace(/^Error:\s*/,'');
      if(m.indexOf('SESI_HABIS')>=0){doLogout(true);rej(new Error('Sesi habis, silakan login lagi'));}
      else rej(new Error(m));
    })[fn](...a);
  });
}
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtD(s){if(!s)return '-';const p=String(s).slice(0,10).split('-');if(p.length<3)return esc(s);return +p[2]+' '+MON[+p[1]-1]+' '+p[0]+(s.length>10?' '+s.slice(11,16):'');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function inP(t){const d=String(t||'').slice(0,10);if(!B.from&&!B.to)return true;if(!d)return false;if(B.from&&d<B.from)return false;if(B.to&&d>B.to)return false;return true;}
function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));}
function pct(a,b){return b?Math.round(a/b*100)+'%':'-';}
function kontakOf(l){let x=[];try{x=l.kontakLain?JSON.parse(l.kontakLain):[];}catch(e){}return [{nama:l.pic,jabatan:l.jabatan,telepon:l.telepon,email:l.email}].concat(Array.isArray(x)?x:[]).filter(c=>c&&(c.nama||c.telepon||c.email));}
function kontakText(l){return kontakOf(l).map(c=>[c.nama,c.jabatan,c.telepon,c.email].join(' ')).join(' ');}
function waNum(t){let n=String(t||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n;}
function lead(id){return B.d.leads.find(l=>l.id===id);}
function realFU(){return B.d.fu.filter(f=>!SYS.includes(f.metode)).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id));}
function sortL(a){return a.slice().sort((x,y)=>(y.tanggal).localeCompare(x.tanggal)||y.id.localeCompare(x.id));}
function opts(arr,cur,first){return (first!=null?`<option value="">${esc(first)}</option>`:'')+arr.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');}
function seg(name,vals,cur){SEG[name]=cur||'';return '<div class="seg">'+vals.map(v=>`<button type="button" data-v="${v}" class="${v===cur?'on '+v:''}" onclick="segSet(this,'${name}')">${v}</button>`).join('')+'</div>';}
function segSet(b,name){SEG[name]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.className='');b.className='on '+b.dataset.v;}
function evLinks(s){let n=0;return String(s).split(/\s*\|\s*/).filter(Boolean).map(x=>/^https?:\/\/\S+$/i.test(x)?`<a href="${esc(x)}" target="_blank" onclick="event.stopPropagation()">Lihat file ${++n}</a>`:esc(x)).join(' · ');}
function badge(v){return v?`<span class="b ${esc(v)}">${esc(v)}</span>`:'<span class="b">Belum</span>';}

/* ========== AUTH ========== */
async function doLogin(){
  const n=$('#lgNama').value.trim(),p=$('#lgPin').value.trim();
  if(!n||!p)return toast('Isi nama dan PIN',1);
  busy(1);
  try{const r=await api('apiLogin',n,p,'bo');B.token=r.token;B.d=r.data;ls('mlbo_tok',r.token);$('#lgPin').value='';showApp();}
  catch(e){toast(e.message,1);}
  busy(0);
}
function doLogout(silent){
  if(!silent&&B.token){try{google.script.run.apiLogout(B.token);}catch(e){}}
  B.token=null;B.d=null;ls('mlbo_tok',null);hideM();
  $('#app').style.display='none';$('#login').style.display='block';
}
function showApp(){
  if(B.d.user.peran!=='Admin'){toast('Back Office hanya untuk Admin',1);doLogout();return;}
  $('#login').style.display='none';$('#app').style.display='block';$('#meName').textContent=B.d.user.nama;go(B.menu);
}
async function reload(){
  busy(1);
  try{B.d=await api('apiGetData',B.token);redraw();toast('Data diperbarui');}catch(e){toast(e.message,1);}
  busy(0);
}
function redraw(){go(B.menu,true);const m=$('#mdl');if(m.style.display==='block'&&m.dataset.lead){if(lead(m.dataset.lead))openLead(m.dataset.lead);else closeM();}}

/* ========== NAV & PERIODE ========== */
function renderMenu(){
  $('#menu').innerHTML=MENU.map(m=>m.length===1?`<div class="grp">${m[0]}</div>`:`<button class="${B.menu===m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('');
}
function go(m,keep){
  B.menu=m;renderMenu();
  $('#pgTitle').textContent=MENU.find(x=>x[0]===m)[1];
  $('#period').style.display=PERIOD_MENUS.includes(m)?'flex':'none';
  $('#pFrom').value=B.from;$('#pTo').value=B.to;
  B.poster=null;PAGES[m]();
  if(!keep)window.scrollTo(0,0);
  document.body.classList.remove('sideopen');
}
function setPreset(v){
  const t=new Date();
  if(v==='hari'){B.from=B.to=ymd(t);}
  else if(v==='bulan'){B.from=ymd(new Date(t.getFullYear(),t.getMonth(),1));B.to=ymd(t);}
  else if(v==='lalu'){B.from=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));B.to=ymd(new Date(t.getFullYear(),t.getMonth(),0));}
  else if(v==='30'){const a=new Date(t);a.setDate(a.getDate()-29);B.from=ymd(a);B.to=ymd(t);}
  else if(v==='tahun'){B.from=t.getFullYear()+'-01-01';B.to=ymd(t);}
  else if(v==='semua'){B.from='';B.to='';}
  else return;
  go(B.menu,true);
}
function setCustom(){B.from=$('#pFrom').value;B.to=$('#pTo').value;$('#pPreset').value='custom';go(B.menu,true);}

/* ========== DASHBOARD ========== */
function group(arr,k){const m={};arr.forEach(x=>{const v=x[k]||'(kosong)';m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function bars(g){if(!g.length)return '<div class="empty">Belum ada data</div>';const mx=g[0][1];return g.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><div><i style="width:${Math.max(3,v/mx*100)}%"></i></div><b>${v}</b></div>`).join('');}
function pDash(){
  const L=B.d.leads.filter(l=>inP(l.tanggal)),F=realFU().filter(f=>inP(f.tanggal));
  const n=fn=>L.filter(fn).length,ser=n(l=>l.sales),deal=n(l=>l.statusSales==='Deal');
  const k=[['Total Leads',L.length,''],['Cold',n(l=>l.statusLead==='Cold'),'Cold'],['Warm',n(l=>l.statusLead==='Warm'),'Warm'],['Hot',n(l=>l.statusLead==='Hot'),'Hot'],
    ['Diserahkan ke Sales',ser,''],['Progres',n(l=>l.statusSales==='Progres'),'Progres'],['Quotation',n(l=>l.statusSales==='Quotation'),'Quotation'],['Deal',deal,'Deal'],
    ['Total Follow Up',F.length,''],['Konversi Deal',pct(deal,ser),'Deal']];
  B.poster=posterSpec('Dashboard Marketing',L,F,{hero:['DEAL',deal,'Konversi '+pct(deal,ser)+' dari lead diserahkan'],
    stats:[['Total Leads',L.length,''],['Hot',n(l=>l.statusLead==='Hot'),'Hot'],['Follow Up',F.length,''],['Diserahkan',ser,'Progres']],
    people:[{title:'Kinerja Marketing',kind:'mkt',list:pplMkt(L,F)},{title:'Kinerja Sales',kind:'sales',list:pplSales(L.filter(l=>l.sales),F)}]});
  $('#pg').innerHTML=dlBar(true)+'<div class="kpis">'+k.map(x=>`<div class="kpi"><span>${x[0]}</span><b class="${x[2]?'t'+x[2]:''}">${x[1]}</b></div>`).join('')+'</div>'+
    `<div class="grid2"><div class="panel"><h3>Leads per Sumber Data</h3>${bars(group(L,'sumber'))}</div><div class="panel"><h3>Follow Up per Metode</h3>${bars(group(F,'metode'))}</div></div>
     <div class="panel"><h3>Follow Up Terbaru</h3>${fuTable(F.slice(0,10),false)}</div>`;
}

/* ========== DATA LEADS ========== */
function pLeads(){
  const f=B.f,Ls=B.d.leads;
  $('#pg').innerHTML=dlBar(true)+`<div class="filters">
    <input placeholder="Cari perusahaan, PIC, telepon, kota, event..." value="${esc(f.q||'')}" oninput="B.f.q=this.value;drawLeads()">
    <select onchange="B.f.sl=this.value;drawLeads()">${opts(ST_LEAD,f.sl,'Semua status lead')}</select>
    <select onchange="B.f.ss=this.value;drawLeads()"><option value="">Semua status sales</option><option value="Belum" ${f.ss==='Belum'?'selected':''}>Belum diserahkan</option>${opts(ST_SALES,f.ss)}</select>
    <select onchange="B.f.mk=this.value;drawLeads()">${opts(uniq(Ls.map(l=>l.marketing)),f.mk,'Semua marketing')}</select>

function readRaw(f){return new Promise((res,rej)=>{if(f.size>5*1024*1024)return rej(new Error('Ukuran file maksimal 5 MB'));const r=new FileReader();r.onload=()=>res({name:f.name,mime:f.type||'application/octet-stream',data:String(r.result).split(',')[1]});r.onerror=()=>rej(new Error('Gagal membaca file'));r.readAsDataURL(f);});}
function readFile(f){
  if(!f.type.startsWith('image/'))return readRaw(f);
  return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const m=1280;if(w>m||h>m){const k=Math.min(m/w,m/h);w=Math.round(w*k);h=Math.round(h*k);}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res({name:(f.name||'evidence').replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.75).split(',')[1]});};
    img.onerror=()=>{URL.revokeObjectURL(url);readRaw(f).then(res,rej);};img.src=url;});
}

  const calc=x=>{const c=fn=>x.filter(fn).length,ser=c(l=>l.sales),deal=c(l=>l.statusSales==='Deal');return [x.length,c(l=>l.statusLead==='Cold'),c(l=>l.statusLead==='Warm'),c(l=>l.statusLead==='Hot'),ser,c(l=>l.statusSales==='Quotation'),deal,pct(deal,ser)];};

  const r2=keys.map(k=>[k].concat(calc(L.filter(l=>(l.sumber||'(kosong)')+' — '+(l.detailSumber||'(tanpa detail)')===k)))).sort((a,b)=>b[1]-a[1]);

    stats:[['Hot',t[4]||0,'Hot'],['Diserahkan',t[5]||0,'Progres'],['Quotation',t[6]||0,'Quotation'],['Deal',t[7]||0,'Deal']],
    mid:{type:'bars',title:'Leads per Sumber Data',data:r1.map(r=>[r[0],r[1]])},
    people:[{title:'Rincian per Sumber',list:r1.map(r=>({name:r[0],note:'Konversi '+r[8],metrics:[['Leads',r[1],''],['Diserahkan',r[5],'Progres'],['Quotation',r[6],'Quotation'],['Deal',r[7],'Deal']]}))},
      {title:'Rincian per Event',list:r2.map(r=>({name:String(r[0]).split(' — ').pop(),note:String(r[0]).split(' — ')[0],metrics:[['Leads',r[1],''],['Diserahkan',r[5],'Progres'],['Quotation',r[6],'Quotation'],['Deal',r[7],'Deal']]}))}],
    donut:{title:'Komposisi Sumber',data:r1.map((r,i)=>[r[0],r[1],PAL[i%PAL.length]])}};
  $('#pg').innerHTML=dlBar()+'<div class="panel"><h3>Per Sumber Data</h3>'+tbl(['Sumber Data'].concat(H),r1,TT)+'</div>'+
    '<div class="panel"><h3>Per Event / Detail Sumber</h3>'+tbl(['Sumber — Event / Detail'].concat(H),r2)+'</div>';
}

function sD(t){const p=String(t||'').slice(0,10).split('-');return p.length<3?String(t||'-'):p[2]+'/'+p[1]+'/'+p[0].slice(2);}

function rr(c,x,y,w,h,r){r=Math.min(r,h/2,w/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fitT(c,t,w){t=String(t==null?'':t);if(c.measureText(t).width<=w)return t;while(t.length&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…';}

function makePdf(jpg,wPx,hPx,iw,ih){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const W=(wPx*0.75).toFixed(2),H=(hPx*0.75).toFixed(2),cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
  const obj=(n,t)=>{off[n]=len;put(n+' 0 obj\n'+t+'\nendobj\n');};
  put('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=len;put('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');put(jpg);put('\nendstream\nendobj\n');
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function saveBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function dlPoster(type){
  if(!B.poster)return toast('Tidak ada laporan untuk diunduh',1);
  try{
    const pp=JSON.parse(JSON.stringify(B.poster));
    if(B.pf!=='all'&&pp.people)pp.people=pp.people.filter(g=>!g.kind||g.kind===B.pf);
    const cv=drawPoster(pp);
    const name=(B.poster.title+' '+(B.from||'semua')+(B.to?' sd '+B.to:'')).replace(/[^\w\-]+/g,'-');
    if(type==='png'){cv.toBlob(b=>saveBlob(b,name+'.png'),'image/png');}
    else{
      const bin=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]),u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      saveBlob(makePdf(u8,cv.width/2,cv.height/2,cv.width,cv.height),name+'.pdf');
    }
    toast('Poster diunduh');
