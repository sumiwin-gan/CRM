<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Marketing Leads</title>
<style>
:root{--p:#1d4ed8;--pd:#1e3a8a;--bg:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);font-size:15px;line-height:1.45}
a{color:var(--p)}
.wrap{max-width:560px;margin:0 auto;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
header .t{font-weight:800;font-size:17px}
header .u{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:140px;border:0;background:none;padding:8px 4px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;cursor:pointer}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--p)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut)}.sm{font-size:13px}.mt{margin-top:10px}
h2{font-size:18px;line-height:1.3}
.ttl{font-weight:800;font-size:15px}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:#f1f5f9;color:#475569}
.Cold{background:#e0f2fe!important;color:#0369a1!important;border-color:#7dd3fc!important}
.Warm{background:#fef3c7!important;color:#b45309!important;border-color:#fcd34d!important}
.Hot{background:#fee2e2!important;color:#b91c1c!important;border-color:#fca5a5!important}
.Progres{background:#ede9fe!important;color:#6d28d9!important;border-color:#c4b5fd!important}
.Quotation{background:#dbeafe!important;color:#1d4ed8!important;border-color:#93c5fd!important}
.Deal{background:#dcfce7!important;color:#15803d!important;border-color:#86efac!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut)}
.lbl{font-size:12px;color:var(--mut);font-weight:700;margin:8px 12px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 4px}
.chip{border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;font-weight:600;color:#334155;cursor:pointer}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.srch{margin:10px 12px 4px}
.lead{cursor:pointer}
.lead .nm{font-weight:700;font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff;font-family:inherit;color:var(--tx)}
input:disabled{background:#f1f5f9;color:var(--mut)}
textarea{resize:vertical}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;text-decoration:none;text-align:center;cursor:pointer}
.btn.full{width:100%;margin-top:16px}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.ghost{background:#eef2ff;color:var(--p)}
.btn.wa{background:#16a34a}
.btn.red{background:#dc2626}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-weight:700;font-size:14px;color:#334155;cursor:pointer}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
.mwrap{max-width:560px;margin:0 auto;padding-bottom:40px}
.mhd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px;z-index:2}
.mhd button{background:none;border:0;color:var(--p);font-weight:700;font-size:15px;padding:4px 6px;cursor:pointer}
.info{display:grid;grid-template-columns:105px 1fr;gap:6px 10px;margin-top:12px;font-size:14px;word-break:break-word}
.info .k{color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fu{border-left:3px solid var(--p);padding:9px 11px;margin-top:10px;background:#f8fafc;border-radius:0 10px 10px 0}
.fu.sys{border-left-color:#94a3b8;background:#f1f5f9}
.fu.click{cursor:pointer}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
#busy{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:50}
.spin{width:42px;height:42px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90%;text-align:center}
#toast.err{background:#dc2626}
.login{max-width:380px;margin:0 auto;padding:60px 16px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin:0 auto 14px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}

/* ===== TAMPILAN PC / LAYAR LEBAR ===== */
@media(min-width:900px){
  #vApp{padding-left:220px}
  .wrap{max-width:1280px;padding:0 0 30px}
  header{padding:16px 24px}
  header .t{font-size:19px}
  .nav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;padding:0 12px;border-top:0;border-right:1px solid var(--bd)}
  .nav::before{content:'Marketing Leads';display:block;font-weight:800;font-size:17px;color:var(--pd);padding:20px 10px 16px;border-bottom:1px solid var(--bd);margin-bottom:8px}
  .nav button{flex:none;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px;border-radius:10px}
  .nav button:hover{background:#f1f5f9}
  .nav button.on{background:#eef2ff}
  #main{padding:8px 12px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .stat{padding:16px 8px}
  .stat b{font-size:26px}
  .srch{max-width:560px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:12px}
  #list .card{margin:0}
  #list .empty{grid-column:1/-1}
  #main>.card{max-width:760px}
  #fulist .card{max-width:900px}
  .modal{background:rgba(15,23,42,.45)}
  .mwrap{max-width:640px;margin:0 0 0 auto;min-height:100%;background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  #toast{bottom:30px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="vLogin" style="display:none">
  <div class="login">
    <div class="logo">ML</div>
    <h2 style="text-align:center">Marketing Leads</h2>
    <p class="mut sm" style="text-align:center">Masuk dengan nama & PIN Anda</p>
    <div class="card" style="margin:20px 0">
      <label>Nama</label><input id="lgNama" autocomplete="username">
      <label>PIN</label><input id="lgPin" type="password" inputmode="numeric" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn full" onclick="doLogin()">Masuk</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="vApp" style="display:none">
  <div class="wrap">
    <header>
      <div><div class="t">Marketing Leads</div><div class="u"><span id="hdName"></span> · <span id="hdRole"></span></div></div>
      <button onclick="reload()">Muat ulang</button>
    </header>
    <div id="main"></div>
  </div>
  <div class="nav" id="nav"></div>
</div>

<div class="modal" id="mdl" onclick="if(event.target===this)closeM()"><div class="mwrap" id="mdlIn"></div></div>
<div id="busy"><div class="spin"></div></div>
<div id="toast"></div>

<script>
/* ====== GANTI DENGAN URL WEB APP (Deploy > Web app), akhiran /exec ====== */
const SCRIPT_URL='PASTE_URL_WEB_APP_DI_SINI';
/* ======================================================================== */
const IS_GAS=!!(window.google&&google.script&&google.script.run);
if(!IS_GAS){
  window.google={script:{run:(function mk(s,f){return new Proxy({},{get(_,k){
    if(k==='withSuccessHandler')return h=>mk(h,f);
    if(k==='withFailureHandler')return h=>mk(s,h);
    return (...a)=>{
      fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:k,args:a})})
        .then(r=>r.json()).then(j=>{if(j.ok)s&&s(j.r);else f&&f(new Error(j.err));})
        .catch(()=>f&&f(new Error('Gagal terhubung ke server. Cek internet / SCRIPT_URL.')));
    };}});})(null,null)}};
}
</script>
<script>
const ST_LEAD=['Cold','Warm','Hot'], ST_SALES=['Progres','Quotation','Deal'], SYS=['Penyerahan','Update Status'];
const ICON={
  leads:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  input:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  fu:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  akun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'
};
let S={token:null,d:null,tab:'leads',q:'',fl:'',fs:'',fq:''};
const SEG={};
const $=s=>document.querySelector(s);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',err?4000:2200);}
function busy(on){$('#busy').style.display=on?'flex':'none';}
function api(fn,...a){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>{
      const m=String(e&&e.message||e).replace(/^Error:\s*/,'');
      if(m.indexOf('SESI_HABIS')>=0){doLogout(true);rej(new Error('Sesi habis, silakan login lagi'));}
      else rej(new Error(m));
    })[fn](...a);
  });
}
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtD(s){if(!s)return '-';const p=String(s).slice(0,10).split('-');if(p.length<3)return s;return +p[2]+' '+MON[+p[1]-1]+' '+p[0]+(s.length>10?' '+s.slice(11,16):'');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function waNum(t){let n=String(t||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n;}
function getLead(id){return S.d.leads.find(l=>l.id===id);}
function sortLeads(a){return a.slice().sort((x,y)=>(y.diubah||y.tanggal).localeCompare(x.diubah||x.tanggal)||y.id.localeCompare(x.id));}
function fuOf(id){return S.d.fu.filter(f=>f.leadId===id).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id));}
function lastFU(id){const f=fuOf(id).find(x=>!SYS.includes(x.metode));return f?f.tanggal:'';}
function seg(name,vals,cur){SEG[name]=cur||'';return '<div class="seg">'+vals.map(v=>`<button type="button" data-v="${v}" class="${v===cur?'on '+v:''}" onclick="segSet(this,'${name}')">${v}</button>`).join('')+'</div>';}
function segSet(b,name){SEG[name]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.className='');b.className='on '+b.dataset.v;}
function opts(arr,cur,first){return (first!=null?`<option value="">${esc(first)}</option>`:'')+arr.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');}
function evLinks(s){let n=0;return String(s).split(/\s*\|\s*/).filter(Boolean).map(x=>/^https?:\/\/\S+$/i.test(x)?`<a href="${esc(x)}" target="_blank" onclick="event.stopPropagation()">Lihat file ${++n}</a>`:esc(x)).join(' · ');}

/* ========== LOGIN ========== */
async function doLogin(){
  const n=$('#lgNama').value.trim(),p=$('#lgPin').value.trim();
  if(!n||!p)return toast('Isi nama dan PIN',1);
  busy(1);
  try{
    const r=await api('apiLogin',n,p,'app');
    S.token=r.token;S.d=r.data;ls('ml_tok',r.token);
    $('#lgPin').value='';showApp();
  }catch(e){toast(e.message,1);}
  busy(0);
}
function doLogout(silent){
  if(!silent&&S.token){try{google.script.run.apiLogout(S.token);}catch(e){}}
  S.token=null;S.d=null;ls('ml_tok',null);closeM();
  $('#vApp').style.display='none';$('#vLogin').style.display='block';
}
async function reload(){
  busy(1);
  try{S.d=await api('apiGetData',S.token);render();const m=$('#mdl');if(m.style.display==='block'&&m.dataset.lead)openLead(m.dataset.lead);toast('Data diperbarui');}catch(e){toast(e.message,1);}
  busy(0);
}
function showApp(){$('#vLogin').style.display='none';$('#vApp').style.display='block';render();}

/* ========== RENDER ========== */
function render(){
  const r=S.d.user.peran;
  $('#hdName').textContent=S.d.user.nama;$('#hdRole').textContent=r;
  const tabs=r==='Sales'?[['leads','Leads'],['fu','Follow Up'],['akun','Akun']]:[['leads','Leads'],['input','Input Lead'],['fu','Follow Up'],['akun','Akun']];
  if(!tabs.find(t=>t[0]===S.tab))S.tab='leads';
  $('#nav').innerHTML=tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="goTab('${t[0]}')">${ICON[t[0]]}${t[1]}</button>`).join('');
  ({leads:rLeads,input:rInput,fu:rFU,akun:rAkun})[S.tab]();
}
function goTab(t){S.tab=t;render();window.scrollTo(0,0);}

function rLeads(){
  const isS=S.d.user.peran==='Sales';
  const all=S.d.leads;
  const c=fn=>all.filter(fn).length;
  const st=isS
    ?[['Diterima',all.length],['Progres',c(l=>l.statusSales==='Progres')],['Quotation',c(l=>l.statusSales==='Quotation')],['Deal',c(l=>l.statusSales==='Deal')]]
    :[['Total',all.length],['Cold',c(l=>l.statusLead==='Cold')],['Warm',c(l=>l.statusLead==='Warm')],['Hot',c(l=>l.statusLead==='Hot')]];
  const chip=(key,v,lab)=>`<button class="chip ${S[key]===v?'on':''}" onclick="S.${key}='${v}';rLeads()">${lab}</button>`;
  let h='<div class="stats">'+st.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')+'</div>';
  h+=`<div class="srch"><input placeholder="Cari perusahaan, PIC, telepon, event..." value="${esc(S.q)}" oninput="S.q=this.value;drawList()"></div>`;
  h+='<div class="lbl">Status Lead</div><div class="chips">'+chip('fl','','Semua')+ST_LEAD.map(v=>chip('fl',v,v)).join('')+'</div>';
  h+='<div class="lbl">Status Sales</div><div class="chips">'+chip('fs','','Semua')+(isS?'':chip('fs','Belum','Belum diserahkan'))+ST_SALES.map(v=>chip('fs',v,v)).join('')+'</div>';
  h+='<div id="list"></div>';
  $('#main').innerHTML=h;drawList();
}
function drawList(){
  const q=S.q.trim().toLowerCase();
  const L=sortLeads(S.d.leads).filter(l=>(!S.fl||l.statusLead===S.fl)&&(!S.fs||(S.fs==='Belum'?!l.sales:l.statusSales===S.fs))&&(!q||[l.perusahaan,l.pic,l.telepon,l.kota,l.detailSumber,l.kebutuhan].join(' ').toLowerCase().includes(q)));
  if(!L.length){$('#list').innerHTML='<div class="empty">Belum ada lead</div>';return;}
  $('#list').innerHTML=L.map(l=>{
    const lf=lastFU(l.id);
    return `<div class="card lead" onclick="openLead('${l.id}')">
      <div class="row"><div class="nm">${esc(l.perusahaan)}</div><span class="b ${l.statusLead}">${l.statusLead}</span></div>
      <div class="sm mut">${esc(l.pic||'-')}${l.telepon?' · '+esc(l.telepon):''}</div>
      <div class="sm mut">${esc(l.sumber||'-')}${l.detailSumber?' · '+esc(l.detailSumber):''}</div>
      <div class="row sm mt"><span>${S.d.user.peran==='Sales'?'Dari: '+esc(l.marketing):(l.sales?'Sales: <b>'+esc(l.sales)+'</b>':'<span class="mut">Belum diserahkan</span>')}</span>${l.sales?`<span class="b ${l.statusSales}">${l.statusSales}</span>`:''}</div>
      <div class="sm mut">Follow up terakhir: ${lf?fmtD(lf):'belum ada'}</div>
    </div>`;}).join('');
}

/* ========== DETAIL ========== */
function openM(html,leadId){const m=$('#mdl');$('#mdlIn').innerHTML=html;m.dataset.lead=leadId||'';m.style.display='block';m.scrollTop=0;}
function closeM(){const m=$('#mdl');m.style.display='none';m.dataset.lead='';}

function openLead(id){
  const l=getLead(id);if(!l){closeM();return;}
  const me=S.d.user.nama,r=S.d.user.peran;
  const canEdit=r==='Admin'||(r==='Marketing'&&l.marketing===me&&!l.sales);
  const canSS=!!l.sales&&(r==='Admin'||(r==='Sales'&&l.sales===me));
  const fus=fuOf(id);
  const realCnt=fus.filter(f=>!SYS.includes(f.metode)).length;
  const inf=[['PIC',l.pic],['Jabatan',l.jabatan],['Telepon',l.telepon],['Email',l.email],['Kota',l.kota],['Kebutuhan',l.kebutuhan],['Sumber Data',l.sumber],['Event / Detail',l.detailSumber],['Marketing',l.marketing],['Tanggal',fmtD(l.tanggal)],['Catatan',l.catatan]];
  let h=`<div class="mhd"><button onclick="closeM()">‹ Kembali</button><b>Detail Lead</b>${canEdit?`<button onclick="editLead('${id}')">Edit</button>`:'<span style="width:50px"></span>'}</div>`;
  h+=`<div class="card"><div class="row"><h2>${esc(l.perusahaan)}</h2><span class="b ${l.statusLead}">${l.statusLead}</span></div>
     <div class="info">${inf.map(x=>`<span class="k">${x[0]}</span><span>${esc(x[1]||'-')}</span>`).join('')}</div>
     ${l.telepon?`<div class="acts"><a class="btn sm ghost" href="tel:${esc(String(l.telepon).replace(/[^\d+]/g,''))}">Telepon</a><a class="btn sm wa" href="https://wa.me/${waNum(l.telepon)}" target="_blank">WhatsApp</a></div>`:''}
  </div>`;
  // Penyerahan ke sales
  h+='<div class="card"><div class="ttl">Diserahkan ke Sales</div>';
  if(l.sales){
    h+=`<div class="row mt"><span>Sales: <b>${esc(l.sales)}</b></span><span class="b ${l.statusSales}">${l.statusSales}</span></div><div class="sm mut">Diserahkan ${fmtD(l.tglSerah)}</div>`;
  }else if(canEdit){
    h+=S.d.sales.length
      ?`<select id="asSel" class="mt">${opts(S.d.sales,'','— pilih sales —')}</select><button class="btn full" onclick="assign('${id}')">Serahkan ke Sales</button><div class="hint">Setelah diserahkan, data lead tidak bisa diedit lagi oleh marketing.</div>`
      :'<div class="mut sm mt">Belum ada pengguna Sales. Tambahkan di Back Office.</div>';
  }else h+='<div class="mut sm mt">Belum diserahkan ke sales</div>';
  if(canSS){
    h+=`<label>Update status sales</label><textarea id="ssNote" rows="2" placeholder="Catatan (opsional), mis. no. quotation / alasan"></textarea>
      <div class="seg mt">${ST_SALES.map(s=>`<button type="button" class="${l.statusSales===s?'on '+s:''}" onclick="setSS('${id}','${s}')">${s}</button>`).join('')}</div>`;
  }
  h+='</div>';
  // Follow up
  h+=`<div class="card"><div class="row"><div class="ttl">Follow Up (${realCnt})</div><button class="btn sm" onclick="fuForm('${id}')">+ Follow Up</button></div>
    ${fus.length?fus.map(f=>fuItem(f,false)).join(''):'<div class="mut sm mt">Belum ada follow up</div>'}</div>`;
  openM(h,id);
}

function fuItem(f,showLead){
  const sys=SYS.includes(f.metode);
  const L=showLead?getLead(f.leadId):null;
  return `<div class="fu ${sys?'sys':''} ${showLead?'click':''}" ${showLead?`onclick="openLead('${f.leadId}')"`:''}>
    <div class="row sm"><b>${esc(f.metode)}</b><span class="mut">${fmtD(f.tanggal)}</span></div>
    ${L?`<div class="sm"><b>${esc(L.perusahaan)}</b></div>`:''}
    <div style="white-space:pre-wrap">${esc(f.hasil)}</div>
    ${f.evidence?`<div class="sm mt">Evidence: ${evLinks(f.evidence)}</div>`:''}
    <div class="sm mut mt">${esc(f.oleh)} (${esc(f.peran)})${!sys&&f.statusLead?` · <span class="b ${f.statusLead}">${f.statusLead}</span>`:''}</div>
  </div>`;
}

/* ========== FOLLOW UP FORM ========== */
function fuForm(id){
  const l=getLead(id);
  const h=`<div class="mhd"><button onclick="openLead('${id}')">‹ Batal</button><b>Follow Up</b><span style="width:50px"></span></div>
  <div class="card"><div class="ttl">${esc(l.perusahaan)}</div><div class="sm mut">${esc(l.pic||'')}</div>
    <label>Metode Follow Up *</label><select id="fu_metode">${opts(S.d.metode,'','— pilih —')}</select>
    <label>Hasil / Reason *</label><textarea id="fu_hasil" rows="4" placeholder="Hasil pembicaraan, alasan, rencana berikutnya..."></textarea>
    <label>Status Lead</label>${seg('fu',ST_LEAD,l.statusLead)}
    <label>Evidence (foto / screenshot / PDF)</label><input type="file" id="fu_file" accept="image/*,application/pdf">
    <label>Link evidence (opsional)</label><input id="fu_link" placeholder="https://...">
    <button class="btn full" onclick="saveFU('${id}')">Simpan Follow Up</button>
  </div>`;
  openM(h,id);
}
async function saveFU(id){
  const metode=$('#fu_metode').value,hasil=$('#fu_hasil').value.trim(),link=$('#fu_link').value.trim();
  if(!metode)return toast('Pilih metode follow up',1);
  if(!hasil)return toast('Isi hasil / reason',1);
  busy(1);
  try{
    const f=$('#fu_file').files[0];
    const file=f?await readFile(f):null;
    S.d=await api('apiAddFU',S.token,{leadId:id,metode,hasil,statusLead:SEG.fu,evidence:link},file);
    toast('Follow up tersimpan');render();openLead(id);
  }catch(e){toast(e.message,1);}
  busy(0);
}
function readRaw(f){
  return new Promise((res,rej)=>{
    if(f.size>5*1024*1024)return rej(new Error('Ukuran file maksimal 5 MB'));
    const r=new FileReader();r.onload=()=>res({name:f.name,mime:f.type||'application/octet-stream',data:String(r.result).split(',')[1]});r.onerror=()=>rej(new Error('Gagal membaca file'));r.readAsDataURL(f);
  });
}
function readFile(f){
  if(!f.type.startsWith('image/'))return readRaw(f);
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;const m=1280;
      if(w>m||h>m){const k=Math.min(m/w,m/h);w=Math.round(w*k);h=Math.round(h*k);}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({name:(f.name||'evidence').replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.75).split(',')[1]});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);readRaw(f).then(res).catch(()=>res(null));};
    img.src=url;
  });
}

/* ========== LEAD FORM ========== */
function leadForm(l,isNew){
  l=l||{};
  const isAdm=S.d.user.peran==='Admin';
  const sumber=S.d.sumber.slice();if(l.sumber&&!sumber.includes(l.sumber))sumber.push(l.sumber);
  const f=(k,lab,ph,type)=>`<label>${lab}</label><input id="lf_${k}" ${type?`type="${type}"`:''} value="${esc(l[k]||'')}" placeholder="${esc(ph||'')}">`;
  return `<div class="card">
    <label>Tanggal</label><input type="date" id="lf_tanggal" value="${esc(l.tanggal||todayStr())}" ${isNew||isAdm?'':'disabled'}>
    ${f('perusahaan','Nama Perusahaan *','PT ...')}
    ${f('pic','Nama PIC','Nama kontak')}
    ${f('jabatan','Jabatan PIC','Purchasing / Owner / ...')}
    ${f('telepon','No. Telepon / WA','08...','tel')}
    ${f('email','Email','','email')}
    ${f('kota','Kota / Alamat','')}
    ${f('kebutuhan','Kebutuhan','Produk, perkiraan volume, dll')}
    <label>Sumber Data *</label><select id="lf_sumber">${opts(sumber,l.sumber||'','— pilih —')}</select>
    ${f('detailSumber','Nama Event / Detail Sumber','mis. Pameran Otomotif JIExpo, Webinar ...')}
    <label>Status Lead</label>${seg('lf',ST_LEAD,l.statusLead||'Cold')}
    <label>Catatan</label><textarea id="lf_catatan" rows="3">${esc(l.catatan||'')}</textarea>
    ${isNew?`<label>Serahkan ke Sales (opsional)</label><select id="lf_sales">${opts(S.d.sales,'','— nanti saja —')}</select>`:''}

}
function rInput(){$('#main').innerHTML='<div class="card" style="margin-bottom:0"><div class="ttl">Input Lead Baru</div><div class="sm mut">Isi data calon customer dari event, online, atau sumber lain.</div></div>'+leadForm(null,true);}
function editLead(id){
  const l=getLead(id);
  openM(`<div class="mhd"><button onclick="openLead('${id}')">‹ Batal</button><b>Edit Lead</b><span style="width:50px"></span></div>`+leadForm(l,false),id);
}
async function saveLead(id){
  const g=k=>{const e=$('#lf_'+k);return e?e.value.trim():'';};
  const d={id,tanggal:g('tanggal'),perusahaan:g('perusahaan'),pic:g('pic'),jabatan:g('jabatan'),telepon:g('telepon'),email:g('email'),kota:g('kota'),kebutuhan:g('kebutuhan'),sumber:g('sumber'),detailSumber:g('detailSumber'),statusLead:SEG.lf,catatan:g('catatan')};
  if(!id)d.sales=g('sales');
  if(!d.perusahaan)return toast('Nama perusahaan wajib diisi',1);
  if(!d.sumber)return toast('Pilih sumber data',1);
  if(!id&&d.sales&&!confirm('Lead langsung diserahkan ke '+d.sales+'?'))return;
  busy(1);
  try{
    S.d=await api('apiSaveLead',S.token,d);
    toast('Lead tersimpan');
    if(id){render();openLead(id);}else{S.tab='leads';render();window.scrollTo(0,0);}
  }catch(e){toast(e.message,1);}
  busy(0);
}

/* ========== FOLLOW UP TAB ========== */
function rFU(){
  $('#main').innerHTML=`<div class="srch"><input placeholder="Cari perusahaan / isi follow up..." value="${esc(S.fq)}" oninput="S.fq=this.value;drawFU()"></div><div id="fulist"></div>`;
  drawFU();
}
function drawFU(){
  const q=S.fq.trim().toLowerCase();
  const F=S.d.fu.filter(f=>!SYS.includes(f.metode)).filter(f=>{if(!q)return true;const l=getLead(f.leadId)||{};return [l.perusahaan,f.hasil,f.metode,f.oleh].join(' ').toLowerCase().includes(q);})
    .sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id)).slice(0,300);
  $('#fulist').innerHTML=F.length?'<div class="card" style="padding-top:4px">'+F.map(f=>fuItem(f,true)).join('')+'</div>':'<div class="empty">Belum ada follow up</div>';
}
